[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tasktune"
version = "0.2.0"
description = "Classical machine learning baseline and evaluation toolkit for customer support inquiry classification"
readme = "README.md"
authors = [{ name = "Deepika J", email = "deepikajagadish668@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.4.0",
    "joblib>=1.4.0",
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["B008"]
